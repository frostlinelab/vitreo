[package]
name = "minimal"
description = "Vitreo minimal demo: gradient backdrop + draggable glass panel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vitreo = { path = "../../vitreo" }
vitreo-egui = { path = "../../vitreo-egui" }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
png = "0.17"
log = { workspace = true }
env_logger = "0.11"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
